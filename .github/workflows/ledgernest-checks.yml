name: LedgerNest checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Record toolchain
        run: dotnet --info
      - name: Restore solution and checks
        run: |
          dotnet restore LedgerNest.CSharp.NET8.Avalonia/LedgerNest.CSharp.sln
          dotnet restore LedgerNest.CSharp.NET8.Avalonia/tests/LedgerNest.UiChecks/LedgerNest.UiChecks.csproj
      - name: Build solution and checks
        run: |
          dotnet build LedgerNest.CSharp.NET8.Avalonia/LedgerNest.CSharp.sln --no-restore
          dotnet build LedgerNest.CSharp.NET8.Avalonia/tests/LedgerNest.UiChecks/LedgerNest.UiChecks.csproj --no-restore
      - name: Run regression checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ui
          dotnet run --no-build --project LedgerNest.CSharp.NET8.Avalonia/tests/LedgerNest.UiChecks -- artifacts/ui 2>&1 | tee artifacts/checks.log
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgernest-checks-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
